<svg viewBox="0 0 500 460" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="500" height="460" fill="#fdfdfb"/>

  <text x="250" y="25" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">DFS Spanning Tree — Discovery Times</text>

  <!-- tree edges -->
  <g stroke="#2c3e50" stroke-width="1.6">
    <line x1="180" y1="60"  x2="180" y2="120"/>  <!-- 1-4 -->
    <line x1="180" y1="140" x2="180" y2="200"/>  <!-- 4-3 -->
    <line x1="180" y1="220" x2="120" y2="280"/>  <!-- 3-5 -->
    <line x1="120" y1="300" x2="120" y2="360"/>  <!-- 5-6 -->
    <line x1="180" y1="220" x2="280" y2="280"/>  <!-- 3-2 -->
  </g>

  <!-- back edges (dashed) -->
  <g stroke="#a33" stroke-width="1.6" stroke-dasharray="6,4" fill="none">
    <path d="M 120,378 C 60,300 60,100 168,52"/>   <!-- 6 -> 1 back edge (via 6-3, drawn to root loosely) -->
    <path d="M 280,298 C 340,200 300,80 194,52"/>  <!-- 2 -> 1 back edge -->
  </g>
  <text x="55" y="220" font-size="12" fill="#a33" font-style="italic">back edge</text>
  <text x="55" y="234" font-size="12" fill="#a33" font-style="italic">(6 &#8594; 3)</text>
  <text x="345" y="180" font-size="12" fill="#a33" font-style="italic">back edge</text>
  <text x="345" y="194" font-size="12" fill="#a33" font-style="italic">(2 &#8594; 1)</text>

  <!-- nodes -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="180" cy="45"  r="19" fill="#2c3e50"/><text x="180" y="50"  text-anchor="middle">1</text>
    <circle cx="180" cy="130" r="18" fill="#2c3e50"/><text x="180" y="135" text-anchor="middle">4</text>
    <circle cx="180" cy="210" r="18" fill="#2c3e50"/><text x="180" y="215" text-anchor="middle">3</text>
    <circle cx="120" cy="290" r="18" fill="#2c3e50"/><text x="120" y="295" text-anchor="middle">5</text>
    <circle cx="120" cy="370" r="18" fill="#2c3e50"/><text x="120" y="375" text-anchor="middle">6</text>
    <circle cx="280" cy="290" r="18" fill="#2c3e50"/><text x="280" y="295" text-anchor="middle">2</text>
  </g>

  <!-- discovery time labels -->
  <g font-size="13" fill="#b8860b" font-weight="bold">
    <text x="130" y="40">d = 1</text>
    <text x="130" y="122">d = 2</text>
    <text x="130" y="202">d = 3</text>
    <text x="65"  y="282">d = 4</text>
    <text x="65"  y="362">d = 5</text>
    <text x="300" y="282">d = 6</text>
  </g>

  <rect x="50" y="405" width="400" height="45" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="250" y="432" text-anchor="middle" font-size="13" fill="#111">Discovery order: 1 &#8594; 4 &#8594; 3 &#8594; 5 &#8594; 6 (back to 3) &#8594; back to 3 &#8594; 2 (back to 1)</text>
</svg>

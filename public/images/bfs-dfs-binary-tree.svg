<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="500" height="320" fill="#fdfdfb"/>

  <!-- Edges -->
  <line x1="250" y1="55" x2="150" y2="130" stroke="#999" stroke-width="1.4"/>
  <line x1="250" y1="55" x2="350" y2="130" stroke="#999" stroke-width="1.4"/>
  <line x1="150" y1="150" x2="100" y2="220" stroke="#999" stroke-width="1.4"/>
  <line x1="150" y1="150" x2="200" y2="220" stroke="#999" stroke-width="1.4"/>
  <line x1="350" y1="150" x2="300" y2="220" stroke="#999" stroke-width="1.4"/>
  <line x1="350" y1="150" x2="400" y2="220" stroke="#999" stroke-width="1.4"/>

  <!-- Nodes -->
  <g font-size="15" fill="#fff" font-weight="bold">
    <circle cx="250" cy="40"  r="19" fill="#2c3e50"/><text x="250" y="46"  text-anchor="middle">1</text>
    <circle cx="150" cy="140" r="18" fill="#b8860b"/><text x="150" y="146" text-anchor="middle">2</text>
    <circle cx="350" cy="140" r="18" fill="#b8860b"/><text x="350" y="146" text-anchor="middle">3</text>
    <circle cx="100" cy="230" r="17" fill="#2c7fb8"/><text x="100" y="236" text-anchor="middle">4</text>
    <circle cx="200" cy="230" r="17" fill="#2c7fb8"/><text x="200" y="236" text-anchor="middle">5</text>
    <circle cx="300" cy="230" r="17" fill="#2c7fb8"/><text x="300" y="236" text-anchor="middle">6</text>
    <circle cx="400" cy="230" r="17" fill="#2c7fb8"/><text x="400" y="236" text-anchor="middle">7</text>
  </g>

  <!-- Sequences -->
  <rect x="20" y="265" width="460" height="45" rx="8" fill="#eef4fa" stroke="#2c7fb8" stroke-width="1.3"/>
  <text x="35" y="284" font-size="14" fill="#2c7fb8" font-weight="bold">BFS = Level order:</text>
  <text x="215" y="284" font-size="14" fill="#111">1, 2, 3, 4, 5, 6, 7</text>
  <text x="35" y="303" font-size="14" fill="#b8860b" font-weight="bold">DFS = Preorder:</text>
  <text x="200" y="303" font-size="14" fill="#111">1, 2, 4, 5, 3, 6, 7</text>
</svg>

<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="820" height="420" fill="#fdfdfb"/>

  <!-- Code box -->
  <rect x="20" y="20" width="460" height="380" rx="8" fill="#f6f6f2" stroke="#ccc" stroke-width="1.5"/>
  <g font-family="Courier New, monospace" font-size="14">
    <text x="36" y="46"  fill="#111">Algorithm RBinSearch(l, h, key)</text>
    <text x="36" y="68"  fill="#111">{</text>
    <text x="54" y="90"  fill="#555">if (l == h)</text>
    <text x="54" y="112" fill="#111">{</text>
    <text x="72" y="134" fill="#2c7fb8">if (A[l] == key)</text>
    <text x="90" y="156" fill="#2c7fb8">return l;</text>
    <text x="72" y="178" fill="#2c7fb8">else</text>
    <text x="90" y="200" fill="#2c7fb8">return 0;</text>
    <text x="54" y="222" fill="#111">}</text>
    <text x="54" y="244" fill="#555">else</text>
    <text x="54" y="266" fill="#111">{</text>
    <text x="72" y="288" fill="#b8860b">mid = (l + h) / 2;</text>
    <text x="72" y="310" fill="#b8860b">if (key == A[mid]) return mid;</text>
    <text x="72" y="332" fill="#b8860b">if (key &lt; A[mid])</text>
    <text x="90" y="354" fill="#a33">return RBinSearch(l, mid-1, key);</text>
    <text x="72" y="376" fill="#b8860b">else</text>
    <text x="90" y="398" fill="#a33">return RBinSearch(mid+1, h, key);</text>
  </g>

  <!-- Braces / cost annotations on the right -->
  <g font-size="15" font-weight="bold">
    <!-- small-problem branch: cost 1 -->
    <path d="M 490,120 C 505,120 505,200 520,200" stroke="#2c7fb8" stroke-width="1.5" fill="none"/>
    <text x="530" y="205" fill="#2c7fb8">1</text>
    <text x="555" y="205" fill="#555" font-size="12" font-weight="normal" font-style="italic">(small problem: n = 1)</text>

    <!-- mid + condition checks: cost 1 -->
    <path d="M 490,290 C 505,290 505,320 520,320" stroke="#b8860b" stroke-width="1.5" fill="none"/>
    <text x="530" y="325" fill="#b8860b">1</text>
    <text x="555" y="325" fill="#555" font-size="12" font-weight="normal" font-style="italic">(mid + comparisons, constant)</text>

    <!-- recursive call: cost T(n/2) -->
    <path d="M 490,365 C 520,365 520,380 550,380" stroke="#a33" stroke-width="1.5" fill="none"/>
    <text x="560" y="385" fill="#a33">T(n/2)</text>
    <text x="560" y="402" fill="#555" font-size="12" font-weight="normal" font-style="italic">only ONE recursive call is made</text>
  </g>

  <!-- Resulting recurrence -->
  <rect x="530" y="50" width="270" height="120" rx="8" fill="#2c3e50"/>
  <text x="665" y="80" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">T(n) =</text>
  <text x="665" y="108" text-anchor="middle" font-size="15" fill="#fff">1     if n = 1</text>
  <text x="665" y="136" text-anchor="middle" font-size="15" fill="#fff">T(n/2) + 1     if n &gt; 1</text>
</svg>

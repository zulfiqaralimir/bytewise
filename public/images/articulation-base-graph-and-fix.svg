<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="900" height="380" fill="#fdfdfb"/>

  <text x="220" y="25" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">Original graph</text>
  <text x="680" y="25" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">Fix: add one edge</text>

  <!-- LEFT PANEL -->
  <g stroke="#999" stroke-width="1.4">
    <line x1="220" y1="55" x2="140" y2="115"/>
    <line x1="220" y1="55" x2="300" y2="115"/>
    <line x1="140" y1="135" x2="210" y2="200"/>
    <line x1="300" y1="135" x2="230" y2="200"/>
    <line x1="220" y1="220" x2="160" y2="290"/>
    <line x1="220" y1="220" x2="280" y2="290"/>
    <line x1="160" y1="300" x2="270" y2="300"/>
  </g>
  <!-- articulation ring around vertex 3 -->
  <circle cx="220" cy="220" r="30" fill="none" stroke="#a33" stroke-width="2.5" stroke-dasharray="5,3"/>

  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="220" cy="40"  r="18" fill="#2c3e50"/><text x="220" y="45"  text-anchor="middle">1</text>
    <circle cx="140" cy="120" r="18" fill="#2c3e50"/><text x="140" y="125" text-anchor="middle">4</text>
    <circle cx="300" cy="120" r="18" fill="#2c3e50"/><text x="300" y="125" text-anchor="middle">2</text>
    <circle cx="220" cy="220" r="18" fill="#a33"/>    <text x="220" y="225" text-anchor="middle">3</text>
    <circle cx="160" cy="300" r="18" fill="#2c3e50"/><text x="160" y="305" text-anchor="middle">5</text>
    <circle cx="280" cy="300" r="18" fill="#2c3e50"/><text x="280" y="305" text-anchor="middle">6</text>
  </g>
  <text x="220" y="345" text-anchor="middle" font-size="13" fill="#a33" font-style="italic">Removing vertex 3 splits the graph into {1,4,2} and {5,6}.</text>

  <!-- divider -->
  <line x1="450" y1="15" x2="450" y2="365" stroke="#ddd" stroke-width="1.3"/>

  <!-- RIGHT PANEL -->
  <g stroke="#999" stroke-width="1.4">
    <line x1="680" y1="55" x2="600" y2="115"/>
    <line x1="680" y1="55" x2="760" y2="115"/>
    <line x1="600" y1="135" x2="670" y2="200"/>
    <line x1="760" y1="135" x2="690" y2="200"/>
    <line x1="680" y1="220" x2="620" y2="290"/>
    <line x1="680" y1="220" x2="740" y2="290"/>
    <line x1="620" y1="300" x2="730" y2="300"/>
  </g>
  <!-- new fix edge: 4 to 5 -->
  <line x1="600" y1="135" x2="622" y2="288" stroke="#2e7d32" stroke-width="2.2" stroke-dasharray="6,4"/>

  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="680" cy="40"  r="18" fill="#2c3e50"/><text x="680" y="45"  text-anchor="middle">1</text>
    <circle cx="600" cy="120" r="18" fill="#2c3e50"/><text x="600" y="125" text-anchor="middle">4</text>
    <circle cx="760" cy="120" r="18" fill="#2c3e50"/><text x="760" y="125" text-anchor="middle">2</text>
    <circle cx="680" cy="220" r="18" fill="#2c3e50"/><text x="680" y="225" text-anchor="middle">3</text>
    <circle cx="620" cy="300" r="18" fill="#2c3e50"/><text x="620" y="305" text-anchor="middle">5</text>
    <circle cx="740" cy="300" r="18" fill="#2c3e50"/><text x="740" y="305" text-anchor="middle">6</text>
  </g>
  <text x="680" y="345" text-anchor="middle" font-size="13" fill="#2e7d32" font-style="italic">Adding edge (4,5) means removing 3 no longer disconnects the graph.</text>
</svg>

<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="900" height="480" fill="#fdfdfb"/>

  <!-- Original array -->
  <text x="30" y="45" font-size="15" fill="#333" font-weight="bold">A</text>
  <g stroke="#2c3e50" stroke-width="1.3" fill="#eef4fa">
    <rect x="50"  y="25" width="44" height="36"/>
    <rect x="94"  y="25" width="44" height="36"/>
    <rect x="138" y="25" width="44" height="36"/>
    <rect x="182" y="25" width="44" height="36"/>
    <rect x="226" y="25" width="44" height="36"/>
    <rect x="270" y="25" width="44" height="36"/>
    <rect x="314" y="25" width="44" height="36"/>
    <rect x="358" y="25" width="44" height="36"/>
  </g>
  <g font-size="14" fill="#111" text-anchor="middle" font-weight="bold">
    <text x="72"  y="48">9</text>
    <text x="116" y="48">3</text>
    <text x="160" y="48">7</text>
    <text x="204" y="48">5</text>
    <text x="248" y="48">6</text>
    <text x="292" y="48">4</text>
    <text x="336" y="48">8</text>
    <text x="380" y="48">2</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="72"  y="20">1</text>
    <text x="116" y="20">2</text>
    <text x="160" y="20">3</text>
    <text x="204" y="20">4</text>
    <text x="248" y="20">5</text>
    <text x="292" y="20">6</text>
    <text x="336" y="20">7</text>
    <text x="380" y="20">8</text>
  </g>

  <!-- Pass 1 -->
  <text x="20" y="115" font-size="13" fill="#b8860b" font-weight="bold">1st pass</text>
  <text x="20" y="132" font-size="11" fill="#555" font-style="italic">merge runs of 1</text>
  <g stroke="#999" stroke-width="1.2" fill="none">
    <path d="M72,65 Q94,90 116,110"/>
    <path d="M160,65 Q182,90 204,110"/>
    <path d="M248,65 Q270,90 292,110"/>
    <path d="M336,65 Q358,90 380,110"/>
  </g>
  <g font-size="15" fill="#111" font-weight="bold" text-anchor="middle">
    <text x="105" y="128">3</text><text x="127" y="128">9</text>
    <text x="215" y="128">5</text><text x="237" y="128">7</text>
    <text x="303" y="128">4</text><text x="325" y="128">6</text>
    <text x="391" y="128">2</text><text x="413" y="128">8</text>
  </g>
  <line x1="97"  y1="134" x2="139" y2="134" stroke="#333" stroke-width="1"/>
  <line x1="207" y1="134" x2="249" y2="134" stroke="#333" stroke-width="1"/>
  <line x1="295" y1="134" x2="337" y2="134" stroke="#333" stroke-width="1"/>
  <line x1="383" y1="134" x2="425" y2="134" stroke="#333" stroke-width="1"/>

  <!-- Pass 2 -->
  <text x="20" y="205" font-size="13" fill="#b8860b" font-weight="bold">2nd pass</text>
  <text x="20" y="222" font-size="11" fill="#555" font-style="italic">merge runs of 2</text>
  <g stroke="#999" stroke-width="1.2" fill="none">
    <path d="M116,145 Q160,175 204,195"/>
    <path d="M304,145 Q348,175 392,195"/>
  </g>
  <g font-size="15" fill="#111" font-weight="bold" text-anchor="middle">
    <text x="150" y="218">3</text><text x="172" y="218">5</text><text x="194" y="218">7</text><text x="216" y="218">9</text>
    <text x="338" y="218">2</text><text x="360" y="218">4</text><text x="382" y="218">6</text><text x="404" y="218">8</text>
  </g>
  <line x1="142" y1="224" x2="226" y2="224" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="224" x2="414" y2="224" stroke="#333" stroke-width="1"/>

  <!-- Pass 3 -->
  <text x="20" y="300" font-size="13" fill="#b8860b" font-weight="bold">3rd pass</text>
  <text x="20" y="317" font-size="11" fill="#555" font-style="italic">merge runs of 4</text>
  <g stroke="#999" stroke-width="1.2" fill="none">
    <path d="M183,235 Q270,265 357,285"/>
  </g>
  <g font-size="16" fill="#111" font-weight="bold" text-anchor="middle">
    <text x="185" y="312">2</text><text x="215" y="312">3</text><text x="245" y="312">4</text><text x="275" y="312">5</text>
    <text x="305" y="312">6</text><text x="335" y="312">7</text><text x="365" y="312">8</text><text x="395" y="312">9</text>
  </g>
  <line x1="177" y1="319" x2="403" y2="319" stroke="#333" stroke-width="1"/>

  <text x="290" y="350" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">Fully sorted after 3 passes</text>

  <!-- Cost-per-pass column -->
  <line x1="470" y1="15" x2="470" y2="330" stroke="#333" stroke-width="1.3"/>
  <text x="500" y="118" font-size="17" fill="#111" font-weight="bold">n</text>
  <text x="500" y="212" font-size="17" fill="#111" font-weight="bold">n</text>
  <text x="500" y="307" font-size="17" fill="#111" font-weight="bold">n</text>
  <text x="550" y="30"  font-size="13" fill="#555" font-style="italic" text-anchor="end">cost per pass</text>

  <!-- log calc box -->
  <rect x="560" y="15" width="320" height="330" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="720" y="45" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">Number of Passes</text>
  <text x="580" y="80"  font-size="14" fill="#111">Pass 1: run size 1 &#8594; 2   (8/2&#185; = 4 pairs)</text>
  <text x="580" y="105" font-size="14" fill="#111">Pass 2: run size 2 &#8594; 4   (8/2&#178; = 2 pairs)</text>
  <text x="580" y="130" font-size="14" fill="#111">Pass 3: run size 4 &#8594; 8   (8/2&#179; = 1 pair)</text>
  <text x="580" y="165" font-size="14" fill="#111">Passes stop once run size = n:</text>
  <text x="580" y="188" font-size="14" fill="#111">8 = 2&#179;  &#8658;  log&#8322;(8) = 3</text>

  <line x1="580" y1="210" x2="860" y2="210" stroke="#ccc" stroke-width="1"/>

  <text x="720" y="240" text-anchor="middle" font-size="15" fill="#111" font-weight="bold">Total Time</text>
  <text x="580" y="270" font-size="14" fill="#111">Each pass costs <tspan font-weight="bold">O(n)</tspan> (every element</text>
  <text x="595" y="290" font-size="14" fill="#111">is merged exactly once per pass)</text>
  <text x="580" y="318" font-size="14" fill="#111">Number of passes = <tspan font-weight="bold">log n</tspan></text>
  <text x="720" y="345" text-anchor="middle" font-size="19" fill="#b8860b" font-weight="bold">O(n log n)</text>
</svg>

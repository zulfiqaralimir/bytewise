<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="900" height="430" fill="#fdfdfb"/>

  <text x="700" y="30" text-anchor="middle" font-size="14" fill="#555" font-style="italic">Constraint: a girl cannot sit in the middle seat (chair 2)</text>

  <!-- Edges: root to level 1 -->
  <line x1="450" y1="52" x2="150" y2="112" stroke="#999" stroke-width="1.3"/>
  <line x1="450" y1="52" x2="450" y2="112" stroke="#999" stroke-width="1.3"/>
  <line x1="450" y1="52" x2="750" y2="112" stroke="#999" stroke-width="1.3"/>

  <!-- Edges: level1 to level2 -->
  <line x1="150" y1="146" x2="90"  y2="212" stroke="#999" stroke-width="1.3"/>
  <line x1="150" y1="146" x2="210" y2="212" stroke="#999" stroke-width="1.3"/>
  <line x1="450" y1="146" x2="390" y2="212" stroke="#999" stroke-width="1.3"/>
  <line x1="450" y1="146" x2="510" y2="212" stroke="#999" stroke-width="1.3"/>
  <line x1="750" y1="146" x2="690" y2="212" stroke="#999" stroke-width="1.3"/>
  <line x1="750" y1="146" x2="810" y2="212" stroke="#999" stroke-width="1.3"/>

  <!-- Edges: level2 to leaf (ONLY for surviving nodes) -->
  <line x1="90"  y1="246" x2="90"  y2="306" stroke="#999" stroke-width="1.3"/>
  <line x1="390" y1="246" x2="390" y2="306" stroke="#999" stroke-width="1.3"/>
  <line x1="690" y1="246" x2="690" y2="306" stroke="#999" stroke-width="1.3"/>
  <line x1="810" y1="246" x2="810" y2="306" stroke="#999" stroke-width="1.3"/>

  <!-- Root -->
  <circle cx="450" cy="40" r="20" fill="#2c3e50"/>
  <text x="450" y="45" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Root</text>

  <!-- Level 1 (chair 1) -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="150" cy="130" r="18" fill="#b8860b"/><text x="150" y="135" text-anchor="middle">B1</text>
    <circle cx="450" cy="130" r="18" fill="#b8860b"/><text x="450" y="135" text-anchor="middle">B2</text>
    <circle cx="750" cy="130" r="18" fill="#b8860b"/><text x="750" y="135" text-anchor="middle">G1</text>
  </g>

  <!-- Level 2 (chair 2) : survivors in blue -->
  <g font-size="13" fill="#fff" font-weight="bold">
    <circle cx="90"  cy="230" r="16" fill="#2c7fb8"/><text x="90"  y="235" text-anchor="middle">B2</text>
    <circle cx="390" cy="230" r="16" fill="#2c7fb8"/><text x="390" y="235" text-anchor="middle">B1</text>
    <circle cx="690" cy="230" r="16" fill="#2c7fb8"/><text x="690" y="235" text-anchor="middle">B1</text>
    <circle cx="810" cy="230" r="16" fill="#2c7fb8"/><text x="810" y="235" text-anchor="middle">B2</text>
  </g>

  <!-- Level 2 (chair 2) : killed nodes in red -->
  <g font-size="13" fill="#fff" font-weight="bold">
    <circle cx="210" cy="230" r="16" fill="#a33"/><text x="210" y="235" text-anchor="middle">G1</text>
    <circle cx="510" cy="230" r="16" fill="#a33"/><text x="510" y="235" text-anchor="middle">G1</text>
  </g>
  <g font-size="16" fill="#a33" font-weight="bold">
    <text x="210" y="270" text-anchor="middle">X</text>
    <text x="510" y="270" text-anchor="middle">X</text>
  </g>
  <g font-size="11" fill="#a33" font-style="italic">
    <text x="210" y="288" text-anchor="middle">killed</text>
    <text x="510" y="288" text-anchor="middle">killed</text>
  </g>

  <!-- Level 3 (chair 3 / leaf) : only surviving branches -->
  <g font-size="13" fill="#fff" font-weight="bold">
    <circle cx="90"  cy="325" r="16" fill="#2e7d32"/><text x="90"  y="330" text-anchor="middle">G1</text>
    <circle cx="390" cy="325" r="16" fill="#2e7d32"/><text x="390" y="330" text-anchor="middle">G1</text>
    <circle cx="690" cy="325" r="16" fill="#2e7d32"/><text x="690" y="330" text-anchor="middle">B2</text>
    <circle cx="810" cy="325" r="16" fill="#2e7d32"/><text x="810" y="330" text-anchor="middle">B1</text>
  </g>

  <!-- Solution captions -->
  <g font-size="12" fill="#333">
    <text x="90"  y="365" text-anchor="middle">Valid: (B1,B2,G1)</text>
    <text x="390" y="365" text-anchor="middle">Valid: (B2,B1,G1)</text>
    <text x="690" y="365" text-anchor="middle">Valid: (G1,B1,B2)</text>
    <text x="810" y="365" text-anchor="middle">Valid: (G1,B2,B1)</text>
  </g>

  <text x="450" y="400" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Bounding function prunes both "girl in chair 2" branches immediately — 4 valid solutions remain (2 pruned before reaching a leaf).</text>
</svg>

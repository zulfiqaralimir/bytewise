<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="760" height="340" fill="#fdfdfb"/>

  <g font-family="Courier New, monospace" font-size="16" fill="#111">
    <text x="30" y="40">Algorithm Sum(A, n)</text>
    <text x="30" y="65">{</text>
    <text x="55" y="95">S = 0;</text>
    <text x="55" y="130">for (i = 0; i &lt; n; i++)</text>
    <text x="55" y="155">{</text>
    <text x="80" y="185">S = S + A[i];</text>
    <text x="55" y="210">}</text>
    <text x="55" y="240">return S;</text>
    <text x="30" y="265">}</text>
  </g>

  <!-- count for S=0 -->
  <line x1="220" y1="88" x2="420" y2="88" stroke="#999" stroke-width="1.2"/>
  <text x="430" y="93" font-size="15" fill="#b8860b" font-weight="bold">1</text>

  <!-- counts for the for-clause: i=0 -> 1, i<n -> n+1, i++ -> n -->
  <line x1="122" y1="114" x2="122" y2="124" stroke="#2c7fb8" stroke-width="1.2"/>
  <text x="122" y="110" text-anchor="middle" font-size="12" fill="#2c7fb8" font-weight="bold">1</text>

  <line x1="189" y1="114" x2="189" y2="124" stroke="#2c7fb8" stroke-width="1.2"/>
  <text x="189" y="110" text-anchor="middle" font-size="12" fill="#2c7fb8" font-weight="bold">n+1</text>

  <line x1="247" y1="114" x2="247" y2="124" stroke="#2c7fb8" stroke-width="1.2"/>
  <text x="247" y="110" text-anchor="middle" font-size="12" fill="#2c7fb8" font-weight="bold">n</text>

  <!-- count for S=S+A[i] -->
  <line x1="240" y1="178" x2="420" y2="178" stroke="#999" stroke-width="1.2"/>
  <text x="430" y="183" font-size="15" fill="#a33" font-weight="bold">n</text>

  <!-- count for return S -->
  <line x1="220" y1="233" x2="420" y2="233" stroke="#999" stroke-width="1.2"/>
  <text x="430" y="238" font-size="15" fill="#b8860b" font-weight="bold">1</text>

  <!-- Result box -->
  <rect x="470" y="60" width="260" height="90" rx="8" fill="#2c3e50"/>
  <text x="600" y="95" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">f(n) = 2n + 3</text>
  <text x="600" y="125" text-anchor="middle" font-size="17" fill="#fff" font-weight="bold">O(n)</text>

  <text x="380" y="300" text-anchor="middle" font-size="13" fill="#555" font-style="italic">The for-clause itself contributes 1 + (n+1) + n; folding in the constants gives 2n + 3 overall — degree 1, so O(n).</text>
</svg>

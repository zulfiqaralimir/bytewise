<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="900" height="500" fill="#fdfdfb"/>

  <!-- height axis -->
  <line x1="40" y1="40" x2="40" y2="330" stroke="#333" stroke-width="1.3"/>
  <text x="20" y="30" font-size="14" fill="#333" font-weight="bold">log n</text>

  <!-- Edges -->
  <g stroke="#999" stroke-width="1.3">
    <line x1="450" y1="55" x2="230" y2="120"/>
    <line x1="450" y1="55" x2="670" y2="120"/>

    <line x1="230" y1="145" x2="130" y2="210"/>
    <line x1="230" y1="145" x2="330" y2="210"/>
    <line x1="670" y1="145" x2="570" y2="210"/>
    <line x1="670" y1="145" x2="770" y2="210"/>

    <line x1="130" y1="235" x2="90"  y2="300"/>
    <line x1="130" y1="235" x2="170" y2="300"/>
    <line x1="330" y1="235" x2="290" y2="300"/>
    <line x1="330" y1="235" x2="370" y2="300"/>
    <line x1="570" y1="235" x2="530" y2="300"/>
    <line x1="570" y1="235" x2="610" y2="300"/>
    <line x1="770" y1="235" x2="730" y2="300"/>
    <line x1="770" y1="235" x2="810" y2="300"/>

    <!-- failure (unsuccessful search) leaves under index 15 -->
    <line x1="810" y1="325" x2="780" y2="380"/>
    <line x1="810" y1="325" x2="840" y2="380"/>
  </g>

  <!-- Level 0 (root) -->
  <circle cx="450" cy="45" r="22" fill="#2c3e50"/>
  <text x="450" y="51" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">8</text>

  <!-- Level 1 -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="230" cy="130" r="20" fill="#b8860b"/><text x="230" y="135" text-anchor="middle">4</text>
    <circle cx="670" cy="130" r="20" fill="#b8860b"/><text x="670" y="135" text-anchor="middle">12</text>
  </g>

  <!-- Level 2 -->
  <g font-size="13" fill="#fff" font-weight="bold">
    <circle cx="130" cy="220" r="18" fill="#2c7fb8"/><text x="130" y="225" text-anchor="middle">2</text>
    <circle cx="330" cy="220" r="18" fill="#2c7fb8"/><text x="330" y="225" text-anchor="middle">6</text>
    <circle cx="570" cy="220" r="18" fill="#2c7fb8"/><text x="570" y="225" text-anchor="middle">10</text>
    <circle cx="770" cy="220" r="18" fill="#2c7fb8"/><text x="770" y="225" text-anchor="middle">14</text>
  </g>

  <!-- Level 3 (leaves) -->
  <g font-size="12" fill="#fff" font-weight="bold">
    <circle cx="90"  cy="310" r="16" fill="#2e7d32"/><text x="90"  y="315" text-anchor="middle">1</text>
    <circle cx="170" cy="310" r="16" fill="#2e7d32"/><text x="170" y="315" text-anchor="middle">3</text>
    <circle cx="290" cy="310" r="16" fill="#2e7d32"/><text x="290" y="315" text-anchor="middle">5</text>
    <circle cx="370" cy="310" r="16" fill="#2e7d32"/><text x="370" y="315" text-anchor="middle">7</text>
    <circle cx="530" cy="310" r="16" fill="#2e7d32"/><text x="530" y="315" text-anchor="middle">9</text>
    <circle cx="610" cy="310" r="16" fill="#2e7d32"/><text x="610" y="315" text-anchor="middle">11</text>
    <circle cx="730" cy="310" r="16" fill="#2e7d32"/><text x="730" y="315" text-anchor="middle">13</text>
    <circle cx="810" cy="310" r="16" fill="#2e7d32"/><text x="810" y="315" text-anchor="middle">15</text>
  </g>

  <!-- failure leaves (unsuccessful search example) -->
  <g>
    <rect x="762" y="380" width="36" height="30" fill="none" stroke="#a33" stroke-width="1.6"/>
    <rect x="822" y="380" width="36" height="30" fill="none" stroke="#a33" stroke-width="1.6"/>
  </g>
  <text x="900" y="330" text-anchor="middle" font-size="11" fill="#a33" font-style="italic" transform="translate(-90,0)"></text>

  <text x="810" y="345" text-anchor="middle" font-size="12" fill="#333">height = 4</text>

  <!-- Height calc box -->
  <rect x="90" y="420" width="720" height="55" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="450" y="443" text-anchor="middle" font-size="14" fill="#111">n + 1 = 15 + 1 = 16 leaf positions &#8658; height = log&#8322;(16) = 4</text>
  <text x="450" y="463" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Every comparison moves one level down this tree — so the number of comparisons is bounded by its height.</text>

  <text x="810" y="370" text-anchor="middle" font-size="10" fill="#a33" font-style="italic">unsuccessful-search leaves</text>
</svg>

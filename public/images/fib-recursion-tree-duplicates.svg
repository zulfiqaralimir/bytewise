<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="1000" height="460" fill="#fdfdfb"/>

  <text x="500" y="14" text-anchor="middle" font-size="15" fill="#a33" font-weight="bold">The same subproblems are solved again and again</text>

  <!-- Edges -->
  <g stroke="#999" stroke-width="1.3">
    <line x1="500" y1="65" x2="250" y2="115"/>
    <line x1="500" y1="65" x2="750" y2="115"/>

    <line x1="250" y1="140" x2="150" y2="190"/>
    <line x1="250" y1="140" x2="350" y2="190"/>
    <line x1="750" y1="140" x2="650" y2="190"/>
    <line x1="750" y1="140" x2="850" y2="190"/>

    <line x1="350" y1="215" x2="300" y2="265"/>
    <line x1="350" y1="215" x2="400" y2="265"/>
    <line x1="650" y1="215" x2="600" y2="265"/>
    <line x1="650" y1="215" x2="700" y2="265"/>
    <line x1="850" y1="215" x2="800" y2="265"/>
    <line x1="850" y1="215" x2="900" y2="265"/>

    <line x1="900" y1="290" x2="860" y2="340"/>
    <line x1="900" y1="290" x2="940" y2="340"/>
  </g>

  <!-- Highlight rings around every duplicated node -->
  <g fill="none" stroke="#a33" stroke-width="2" stroke-dasharray="4,3">
    <!-- fib(2) x3 -->
    <circle cx="350" cy="195" r="28"/>
    <circle cx="650" cy="195" r="28"/>
    <circle cx="900" cy="270" r="26"/>
    <!-- fib(1) x5 -->
    <circle cx="150" cy="195" r="25"/>
    <circle cx="400" cy="270" r="23"/>
    <circle cx="700" cy="270" r="23"/>
    <circle cx="800" cy="270" r="23"/>
    <circle cx="940" cy="345" r="22"/>
    <!-- fib(0) x3 -->
    <circle cx="300" cy="270" r="23"/>
    <circle cx="600" cy="270" r="23"/>
    <circle cx="860" cy="345" r="22"/>
    <!-- fib(3) x2 -->
    <circle cx="250" cy="120" r="30"/>
    <circle cx="850" cy="195" r="28"/>
  </g>

  <!-- Level 0 -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="500" cy="40" r="24" fill="#2c3e50"/><text x="500" y="45" text-anchor="middle">fib(5)</text>
  </g>

  <!-- Level 1 -->
  <g font-size="13" fill="#fff" font-weight="bold">
    <circle cx="250" cy="120" r="22" fill="#b8860b"/><text x="250" y="125" text-anchor="middle">fib(3)</text>
    <circle cx="750" cy="120" r="22" fill="#b8860b"/><text x="750" y="125" text-anchor="middle">fib(4)</text>
  </g>

  <!-- Level 2 -->
  <g font-size="12" fill="#fff" font-weight="bold">
    <circle cx="150" cy="195" r="19" fill="#2e7d32"/><text x="150" y="199" text-anchor="middle">fib(1)</text>
    <circle cx="350" cy="195" r="20" fill="#2c7fb8"/><text x="350" y="199" text-anchor="middle">fib(2)</text>
    <circle cx="650" cy="195" r="20" fill="#2c7fb8"/><text x="650" y="199" text-anchor="middle">fib(2)</text>
    <circle cx="850" cy="195" r="20" fill="#b8860b"/><text x="850" y="199" text-anchor="middle">fib(3)</text>
  </g>

  <!-- Level 3 -->
  <g font-size="11" fill="#fff" font-weight="bold">
    <circle cx="300" cy="270" r="17" fill="#2e7d32"/><text x="300" y="274" text-anchor="middle">fib(0)</text>
    <circle cx="400" cy="270" r="17" fill="#2e7d32"/><text x="400" y="274" text-anchor="middle">fib(1)</text>
    <circle cx="600" cy="270" r="17" fill="#2e7d32"/><text x="600" y="274" text-anchor="middle">fib(0)</text>
    <circle cx="700" cy="270" r="17" fill="#2e7d32"/><text x="700" y="274" text-anchor="middle">fib(1)</text>
    <circle cx="800" cy="270" r="17" fill="#2e7d32"/><text x="800" y="274" text-anchor="middle">fib(1)</text>
    <circle cx="900" cy="270" r="18" fill="#2c7fb8"/><text x="900" y="274" text-anchor="middle">fib(2)</text>
  </g>

  <!-- Level 4 -->
  <g font-size="11" fill="#fff" font-weight="bold">
    <circle cx="860" cy="345" r="16" fill="#2e7d32"/><text x="860" y="349" text-anchor="middle">fib(0)</text>
    <circle cx="940" cy="345" r="16" fill="#2e7d32"/><text x="940" y="349" text-anchor="middle">fib(1)</text>
  </g>

  <rect x="90" y="395" width="820" height="55" rx="8" fill="#f4f1e9" stroke="#a33" stroke-width="1.3"/>
  <text x="500" y="416" text-anchor="middle" font-size="13" fill="#111">Dashed circles = repeated calls: fib(3) &#215;2, fib(2) &#215;3, fib(1) &#215;5, fib(0) &#215;3</text>
  <text x="500" y="437" text-anchor="middle" font-size="13" fill="#111">This wasted, repeated work is exactly what Dynamic Programming eliminates.</text>
</svg>

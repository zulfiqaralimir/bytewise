<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="640" height="300" fill="#fdfdfb"/>

  <!-- Leaves: 4 sorted lists -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <rect x="30"  y="20" width="60" height="34" rx="6" fill="#2c3e50"/><text x="60"  y="42" text-anchor="middle">A</text>
    <rect x="130" y="20" width="60" height="34" rx="6" fill="#2c3e50"/><text x="160" y="42" text-anchor="middle">B</text>
    <rect x="230" y="20" width="60" height="34" rx="6" fill="#2c3e50"/><text x="260" y="42" text-anchor="middle">C</text>
    <rect x="330" y="20" width="60" height="34" rx="6" fill="#2c3e50"/><text x="360" y="42" text-anchor="middle">D</text>
  </g>

  <!-- level 1 edges -->
  <g stroke="#999" stroke-width="1.3">
    <line x1="60"  y1="54" x2="105" y2="100"/>
    <line x1="160" y1="54" x2="115" y2="100"/>
    <line x1="260" y1="54" x2="305" y2="100"/>
    <line x1="360" y1="54" x2="315" y2="100"/>
  </g>

  <!-- level 1 merge nodes: 2-way merges -->
  <rect x="70"  y="100" width="80" height="36" rx="6" fill="#b8860b"/>
  <text x="110" y="123" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">merge(A,B)</text>
  <rect x="270" y="100" width="80" height="36" rx="6" fill="#b8860b"/>
  <text x="310" y="123" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">merge(C,D)</text>

  <!-- level 2 edges -->
  <g stroke="#999" stroke-width="1.3">
    <line x1="110" y1="136" x2="195" y2="185"/>
    <line x1="310" y1="136" x2="225" y2="185"/>
  </g>

  <!-- final merge node -->
  <rect x="150" y="185" width="130" height="38" rx="6" fill="#2e7d32"/>
  <text x="215" y="209" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Final sorted list</text>

  <!-- annotation on the right: generalization note -->
  <rect x="420" y="60" width="200" height="170" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="520" y="85" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Merging, generalized</text>
  <text x="435" y="112" font-size="13" fill="#111"><tspan font-weight="bold">2-way merging</tspan> — combine</text>
  <text x="435" y="130" font-size="13" fill="#111">2 sorted lists at a time</text>
  <text x="435" y="158" font-size="13" fill="#111"><tspan font-weight="bold">M-way merging</tspan> — combine</text>
  <text x="435" y="176" font-size="13" fill="#111">M sorted lists in one pass</text>
  <text x="435" y="204" font-size="13" fill="#111">(e.g. <tspan font-weight="bold">4-way</tspan> merges A,B,C,D</text>
  <text x="435" y="220" font-size="13" fill="#111">directly, in a single step)</text>

  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#555" font-style="italic">This lesson builds Merge Sort from repeated 2-way merges.</text>
</svg>

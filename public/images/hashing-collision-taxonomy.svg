<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="700" height="300" fill="#fdfdfb"/>

  <rect x="270" y="15" width="160" height="42" rx="8" fill="#2c3e50"/>
  <text x="350" y="41" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">Collision Resolution</text>

  <line x1="350" y1="57" x2="180" y2="100" stroke="#999" stroke-width="1.3"/>
  <line x1="350" y1="57" x2="520" y2="100" stroke="#999" stroke-width="1.3"/>

  <rect x="90"  y="100" width="180" height="42" rx="8" fill="#b8860b"/>
  <text x="180" y="126" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Open Hashing</text>

  <rect x="430" y="100" width="180" height="42" rx="8" fill="#b8860b"/>
  <text x="520" y="126" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Closed Hashing</text>

  <line x1="180" y1="142" x2="180" y2="180" stroke="#999" stroke-width="1.3"/>
  <rect x="100" y="180" width="160" height="38" rx="8" fill="#2c7fb8"/>
  <text x="180" y="204" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Chaining</text>

  <line x1="520" y1="142" x2="520" y2="175" stroke="#999" stroke-width="1.3"/>
  <rect x="430" y="175" width="180" height="36" rx="8" fill="#2c7fb8"/>
  <text x="520" y="197" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Open Addressing</text>

  <line x1="480" y1="211" x2="440" y2="245" stroke="#999" stroke-width="1.3"/>
  <line x1="560" y1="211" x2="600" y2="245" stroke="#999" stroke-width="1.3"/>

  <rect x="355" y="245" width="170" height="38" rx="8" fill="#2e7d32"/>
  <text x="440" y="269" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Linear Probing</text>

  <rect x="530" y="245" width="170" height="38" rx="8" fill="#2e7d32"/>
  <text x="615" y="269" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Quadratic Probing</text>
</svg>

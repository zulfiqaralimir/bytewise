<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="780" height="400" fill="#fdfdfb"/>

  <text x="390" y="26" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">BFS Spanning Tree</text>
  <text x="390" y="46" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Visit order: 1, 4, 2, 3, 5, 8, 7, 10, 9, 6</text>

  <!-- Tree edges (solid) -->
  <g stroke="#2c3e50" stroke-width="1.6">
    <line x1="390" y1="80"  x2="220" y2="150"/> <!-- 1-4 -->
    <line x1="390" y1="80"  x2="560" y2="150"/> <!-- 1-2 -->
    <line x1="220" y1="150" x2="220" y2="230"/> <!-- 4-3 -->
    <line x1="220" y1="230" x2="150" y2="310"/> <!-- 3-10 -->
    <line x1="220" y1="230" x2="250" y2="310"/> <!-- 3-9 -->
    <line x1="560" y1="150" x2="470" y2="230"/> <!-- 2-5 -->
    <line x1="560" y1="150" x2="560" y2="230"/> <!-- 2-8 -->
    <line x1="560" y1="150" x2="650" y2="230"/> <!-- 2-7 -->
    <line x1="470" y1="230" x2="470" y2="310"/> <!-- 5-6 -->
  </g>

  <!-- Cross edges (dashed) -->
  <g stroke="#a33" stroke-width="1.4" stroke-dasharray="5,4" fill="none">
    <path d="M 220,230 Q 320,190 560,150" />       <!-- 3-2 cross -->
    <path d="M 470,230 Q 515,270 560,230" />       <!-- 5-8 cross -->
    <path d="M 470,230 Q 560,290 650,230" />       <!-- 5-7 cross -->
    <path d="M 560,230 Q 605,270 650,230" />       <!-- 8-7 cross -->
  </g>

  <!-- Nodes -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="390" cy="70"  r="19" fill="#2c3e50"/><text x="390" y="76"  text-anchor="middle">1</text>
    <circle cx="220" cy="150" r="17" fill="#b8860b"/><text x="220" y="156" text-anchor="middle">4</text>
    <circle cx="560" cy="150" r="17" fill="#b8860b"/><text x="560" y="156" text-anchor="middle">2</text>
    <circle cx="220" cy="230" r="16" fill="#2c7fb8"/><text x="220" y="236" text-anchor="middle">3</text>
    <circle cx="470" cy="230" r="16" fill="#2c7fb8"/><text x="470" y="236" text-anchor="middle">5</text>
    <circle cx="560" cy="230" r="16" fill="#2c7fb8"/><text x="560" y="236" text-anchor="middle">8</text>
    <circle cx="650" cy="230" r="16" fill="#2c7fb8"/><text x="650" y="236" text-anchor="middle">7</text>
    <circle cx="150" cy="310" r="15" fill="#2e7d32"/><text x="150" y="316" text-anchor="middle">10</text>
    <circle cx="250" cy="310" r="15" fill="#2e7d32"/><text x="250" y="316" text-anchor="middle">9</text>
    <circle cx="470" cy="310" r="15" fill="#2e7d32"/><text x="470" y="316" text-anchor="middle">6</text>
  </g>

  <!-- Legend -->
  <line x1="60" y1="370" x2="100" y2="370" stroke="#2c3e50" stroke-width="1.6"/>
  <text x="110" y="374" font-size="12" fill="#333">Tree edge</text>
  <line x1="220" y1="370" x2="260" y2="370" stroke="#a33" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="270" y="374" font-size="12" fill="#333">Cross edge (already visited)</text>
</svg>

<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="700" height="340" fill="#fdfdfb"/>

  <text x="30" y="30" font-size="15" fill="#333" font-weight="bold">Key space</text>
  <ellipse cx="90" cy="170" rx="70" ry="130" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.5"/>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="90" y="70">8</text>
    <text x="90" y="100">3</text>
    <text x="90" y="130">13</text>
    <text x="90" y="160">6</text>
    <text x="90" y="190">4</text>
    <text x="90" y="220">10</text>
  </g>

  <rect x="260" y="35" width="170" height="45" rx="6" fill="#eef4fa" stroke="#2c7fb8" stroke-width="1.3"/>
  <text x="345" y="62" text-anchor="middle" font-size="15" fill="#2c7fb8" font-weight="bold">h(x) = x % size</text>
  <text x="345" y="18" text-anchor="middle" font-size="12" fill="#555" font-style="italic">size = 10</text>

  <text x="530" y="30" font-size="15" fill="#333" font-weight="bold">Hash Table</text>
  <g stroke="#2c3e50" stroke-width="1.2" fill="#fff">
    <rect x="500" y="45"  width="140" height="26"/>
    <rect x="500" y="71"  width="140" height="26"/>
    <rect x="500" y="97"  width="140" height="26"/>
    <rect x="500" y="123" width="140" height="26" fill="#fbeaea"/>
    <rect x="500" y="149" width="140" height="26"/>
    <rect x="500" y="175" width="140" height="26"/>
    <rect x="500" y="201" width="140" height="26"/>
    <rect x="500" y="227" width="140" height="26"/>
    <rect x="500" y="253" width="140" height="26"/>
    <rect x="500" y="279" width="140" height="26"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="485" y="62"  text-anchor="end">0</text>
    <text x="485" y="88"  text-anchor="end">1</text>
    <text x="485" y="114" text-anchor="end">2</text>
    <text x="485" y="140" text-anchor="end">3</text>
    <text x="485" y="166" text-anchor="end">4</text>
    <text x="485" y="192" text-anchor="end">5</text>
    <text x="485" y="218" text-anchor="end">6</text>
    <text x="485" y="244" text-anchor="end">7</text>
    <text x="485" y="270" text-anchor="end">8</text>
    <text x="485" y="296" text-anchor="end">9</text>
  </g>
  <g font-size="14" fill="#111" font-weight="bold">
    <text x="565" y="140">3</text>
    <text x="565" y="270">8</text>
  </g>
  <text x="640" y="136" font-size="11" fill="#a33" font-weight="bold">collision</text>
  <text x="640" y="150" font-size="10" fill="#a33" font-style="italic">13%10=3</text>

  <!-- arrows -->
  <g stroke="#2c7fb8" stroke-width="1.1" opacity="0.85">
    <path d="M115,100 C 250,100 400,140 498,140" fill="none"/>
    <path d="M115,130 C 250,130 400,140 498,140" fill="none" stroke="#a33"/>
    <path d="M115,70  C 250,70  400,270 498,270" fill="none"/>
  </g>

  <text x="350" y="325" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Reducing the table size fixes the wasted-space problem, but different keys can now land on the same index.</text>
</svg>

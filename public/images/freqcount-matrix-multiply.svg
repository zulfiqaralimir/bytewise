<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="860" height="400" fill="#fdfdfb"/>

  <g font-family="Courier New, monospace" font-size="14" fill="#111">
    <text x="30" y="30">Algorithm Multiply(A, B, n)</text>
    <text x="30" y="52">{</text>
    <text x="55" y="78">for (i = 0; i &lt; n; i++)</text>
    <text x="55" y="98">{</text>
    <text x="80" y="122">for (j = 0; j &lt; n; j++)</text>
    <text x="80" y="142">{</text>
    <text x="105" y="166">C[i,j] = 0;</text>
    <text x="105" y="190">for (k = 0; k &lt; n; k++)</text>
    <text x="105" y="210">{</text>
    <text x="130" y="234">C[i,j] = C[i,j] + A[i,k]*B[k,j];</text>
    <text x="105" y="256">}</text>
    <text x="80" y="278">}</text>
    <text x="55" y="300">}</text>
    <text x="30" y="322">}</text>
  </g>

  <!-- i loop -->
  <line x1="290" y1="70" x2="440" y2="70" stroke="#999" stroke-width="1.2"/>
  <text x="450" y="75" font-size="14" fill="#b8860b" font-weight="bold">n + 1</text>

  <!-- j loop -->
  <line x1="315" y1="114" x2="440" y2="114" stroke="#999" stroke-width="1.2"/>
  <text x="450" y="119" font-size="14" fill="#2c7fb8" font-weight="bold">(n+1) &#215; n</text>

  <!-- C[i,j]=0 -->
  <line x1="255" y1="158" x2="440" y2="158" stroke="#999" stroke-width="1.2"/>
  <text x="450" y="163" font-size="14" fill="#a33" font-weight="bold">n &#215; n</text>

  <!-- k loop -->
  <line x1="345" y1="182" x2="440" y2="182" stroke="#999" stroke-width="1.2"/>
  <text x="450" y="187" font-size="14" fill="#2c7fb8" font-weight="bold">(n+1) &#215; n &#215; n</text>

  <!-- inner statement -->
  <line x1="415" y1="226" x2="440" y2="226" stroke="#999" stroke-width="1.2"/>
  <text x="450" y="231" font-size="14" fill="#a33" font-weight="bold">n &#215; n &#215; n</text>

  <!-- Result box -->
  <rect x="600" y="40" width="230" height="110" rx="8" fill="#2c3e50"/>
  <text x="715" y="72" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">f(n) = 2n&#179; + 3n&#178; + 2n + 1</text>
  <text x="715" y="105" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">O(n&#179;)</text>

  <!-- Space box -->
  <rect x="600" y="165" width="230" height="150" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="715" y="188" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Space</text>
  <text x="618" y="210" font-size="13" fill="#111">A, B, C &#8594; n&#178; each</text>
  <text x="618" y="230" font-size="13" fill="#111">n, i, j, k &#8594; 1 each</text>
  <text x="715" y="258" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">S(n) = 3n&#178; + 4</text>
  <text x="715" y="282" text-anchor="middle" font-size="16" fill="#b8860b" font-weight="bold">O(n&#178;)</text>

  <text x="330" y="355" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Three nested loops &#8594; time is degree 3 (O(n&#179;)); only the matrices are size n&#178;, so space stays O(n&#178;).</text>
</svg>

<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="700" height="380" fill="#fdfdfb"/>

  <!-- Edges -->
  <line x1="190" y1="150" x2="150" y2="60"  stroke="#999" stroke-width="1.4"/>
  <line x1="190" y1="150" x2="230" y2="60"  stroke="#999" stroke-width="1.4"/>
  <line x1="190" y1="150" x2="400" y2="150" stroke="#999" stroke-width="1.4"/>
  <line x1="400" y1="150" x2="350" y2="60"  stroke="#999" stroke-width="1.4"/>
  <line x1="400" y1="150" x2="430" y2="60"  stroke="#999" stroke-width="1.4"/>
  <line x1="400" y1="150" x2="550" y2="150" stroke="#999" stroke-width="1.4"/>

  <!-- Nodes -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="150" cy="50" r="17" fill="#2c3e50"/><text x="150" y="55" text-anchor="middle">5</text>
    <circle cx="230" cy="50" r="17" fill="#2c3e50"/><text x="230" y="55" text-anchor="middle">4</text>
    <circle cx="190" cy="150" r="19" fill="#b8860b"/><text x="190" y="155" text-anchor="middle">1</text>
    <circle cx="350" cy="50" r="17" fill="#2c3e50"/><text x="350" y="55" text-anchor="middle">7</text>
    <circle cx="430" cy="50" r="17" fill="#2c3e50"/><text x="430" y="55" text-anchor="middle">6</text>
    <circle cx="400" cy="150" r="19" fill="#b8860b"/><text x="400" y="155" text-anchor="middle">2</text>
    <circle cx="550" cy="150" r="17" fill="#2c3e50"/><text x="550" y="155" text-anchor="middle">3</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="200" width="300" height="80" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="35" y="222" font-size="13" fill="#111"><tspan font-weight="bold">Visiting</tspan> a vertex = marking it reached.</text>
  <text x="35" y="248" font-size="13" fill="#111"><tspan font-weight="bold">Exploration</tspan> of a vertex = visiting</text>
  <text x="35" y="266" font-size="13" fill="#111">all of its adjacent vertices.</text>

  <!-- Sequences -->
  <rect x="20" y="300" width="660" height="65" rx="8" fill="#eef4fa" stroke="#2c7fb8" stroke-width="1.3"/>
  <text x="40" y="325" font-size="15" fill="#2c7fb8" font-weight="bold">BFS starting at 1:</text>
  <text x="220" y="325" font-size="15" fill="#111">1, 2, 4, 5, 7, 3, 6</text>
  <text x="40" y="352" font-size="15" fill="#b8860b" font-weight="bold">DFS starting at 1:</text>
  <text x="220" y="352" font-size="15" fill="#111">1, 2, 3, 6, 7, 4, 5</text>
</svg>

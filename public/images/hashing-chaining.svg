<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="760" height="340" fill="#fdfdfb"/>

  <text x="30" y="30" font-size="15" fill="#333" font-weight="bold">Key space</text>
  <ellipse cx="90" cy="170" rx="70" ry="130" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.5"/>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="90" y="70">8</text>
    <text x="90" y="100">3</text>
    <text x="90" y="130">13</text>
    <text x="90" y="160">6</text>
    <text x="90" y="190">4</text>
    <text x="90" y="220">10</text>
  </g>

  <text x="330" y="20" font-size="13" fill="#2c7fb8" font-weight="bold">h(x) = x % 10</text>

  <text x="500" y="30" font-size="15" fill="#333" font-weight="bold">Hash Table (with chains)</text>
  <g stroke="#2c3e50" stroke-width="1.2" fill="#fff">
    <rect x="470" y="45"  width="60" height="26"/>
    <rect x="470" y="71"  width="60" height="26"/>
    <rect x="470" y="97"  width="60" height="26"/>
    <rect x="470" y="123" width="60" height="26" fill="#fbeaea"/>
    <rect x="470" y="149" width="60" height="26"/>
    <rect x="470" y="175" width="60" height="26"/>
    <rect x="470" y="201" width="60" height="26"/>
    <rect x="470" y="227" width="60" height="26"/>
    <rect x="470" y="253" width="60" height="26"/>
    <rect x="470" y="279" width="60" height="26"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="460" y="62"  text-anchor="end">0</text>
    <text x="460" y="88"  text-anchor="end">1</text>
    <text x="460" y="114" text-anchor="end">2</text>
    <text x="460" y="140" text-anchor="end">3</text>
    <text x="460" y="166" text-anchor="end">4</text>
    <text x="460" y="192" text-anchor="end">5</text>
    <text x="460" y="218" text-anchor="end">6</text>
    <text x="460" y="244" text-anchor="end">7</text>
    <text x="460" y="270" text-anchor="end">8</text>
    <text x="460" y="296" text-anchor="end">9</text>
  </g>

  <!-- chain nodes -->
  <g font-size="13" fill="#111" font-weight="bold" text-anchor="middle">
    <!-- index 0 -> 10 -->
    <line x1="530" y1="58" x2="555" y2="58" stroke="#2c7fb8" stroke-width="1.3"/>
    <rect x="557" y="45" width="36" height="26" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="575" y="63">10</text>

    <!-- index 3 -> 3 -> 13 -->
    <line x1="530" y1="136" x2="555" y2="136" stroke="#2c7fb8" stroke-width="1.3"/>
    <rect x="557" y="123" width="36" height="26" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="575" y="141">3</text>
    <line x1="593" y1="136" x2="613" y2="136" stroke="#a33" stroke-width="1.3"/>
    <rect x="615" y="123" width="36" height="26" fill="#fbeaea" stroke="#a33" stroke-width="1.2"/>
    <text x="633" y="141">13</text>

    <!-- index 4 -> 4 -->
    <line x1="530" y1="162" x2="555" y2="162" stroke="#2c7fb8" stroke-width="1.3"/>
    <rect x="557" y="149" width="36" height="26" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="575" y="167">4</text>

    <!-- index 6 -> 6 -->
    <line x1="530" y1="214" x2="555" y2="214" stroke="#2c7fb8" stroke-width="1.3"/>
    <rect x="557" y="201" width="36" height="26" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="575" y="219">6</text>

    <!-- index 8 -> 8 -->
    <line x1="530" y1="266" x2="555" y2="266" stroke="#2c7fb8" stroke-width="1.3"/>
    <rect x="557" y="253" width="36" height="26" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.2"/>
    <text x="575" y="271">8</text>
  </g>

  <text x="633" y="97" text-anchor="middle" font-size="11" fill="#a33" font-style="italic">13 % 10 = 3, collides</text>
  <text x="633" y="110" text-anchor="middle" font-size="11" fill="#a33" font-style="italic">with 3 &#8212; chained instead</text>
  <text x="633" y="123" text-anchor="middle" font-size="11" fill="#a33" font-style="italic">of overwriting it</text>

  <rect x="70" y="300" width="620" height="34" rx="6" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.2"/>
  <text x="380" y="322" text-anchor="middle" font-size="13" fill="#111">Searching key 13: h(13) = 3 &#8594; go to index 3 &#8594; scan the chain (3, then 13) until found.</text>
</svg>

<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="560" height="480" fill="#fdfdfb"/>

  <text x="280" y="25" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">DFS Tree — Discovery Time d[ ] and Low-Link L[ ]</text>

  <!-- tree edges -->
  <g stroke="#2c3e50" stroke-width="1.6">
    <line x1="200" y1="60"  x2="200" y2="120"/>
    <line x1="200" y1="140" x2="200" y2="205"/>
    <line x1="200" y1="228" x2="140" y2="285"/>
    <line x1="140" y1="305" x2="140" y2="365"/>
    <line x1="200" y1="228" x2="300" y2="285"/>
  </g>

  <!-- back edges -->
  <g stroke="#a33" stroke-width="1.6" stroke-dasharray="6,4" fill="none">
    <path d="M 140,383 C 70,300 70,100 188,52"/>
    <path d="M 300,303 C 360,200 320,80 214,52"/>
  </g>

  <!-- articulation highlight ring around vertex 3 -->
  <circle cx="200" cy="217" r="27" fill="none" stroke="#a33" stroke-width="2.5"/>

  <!-- nodes -->
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="200" cy="45"  r="19" fill="#2c3e50"/><text x="200" y="50"  text-anchor="middle">1</text>
    <circle cx="200" cy="130" r="18" fill="#2c3e50"/><text x="200" y="135" text-anchor="middle">4</text>
    <circle cx="200" cy="217" r="18" fill="#a33"/>    <text x="200" y="222" text-anchor="middle">3</text>
    <circle cx="140" cy="295" r="18" fill="#2c3e50"/><text x="140" y="300" text-anchor="middle">5</text>
    <circle cx="140" cy="375" r="18" fill="#2c3e50"/><text x="140" y="380" text-anchor="middle">6</text>
    <circle cx="300" cy="295" r="18" fill="#2c3e50"/><text x="300" y="300" text-anchor="middle">2</text>
  </g>

  <!-- d and L labels -->
  <g font-size="12">
    <text x="230" y="38"  fill="#b8860b" font-weight="bold">d=1, L=1</text>
    <text x="230" y="122" fill="#b8860b" font-weight="bold">d=2, L=1</text>
    <text x="230" y="210" fill="#a33"    font-weight="bold">d=3, L=1</text>
    <text x="30"  y="288" fill="#2c7fb8" font-weight="bold">d=4, L=3</text>
    <text x="30"  y="368" fill="#2c7fb8" font-weight="bold">d=5, L=3</text>
    <text x="315" y="288" fill="#b8860b" font-weight="bold">d=6, L=1</text>
  </g>

  <rect x="30" y="410" width="500" height="60" rx="8" fill="#f4f1e9" stroke="#a33" stroke-width="1.5"/>
  <text x="280" y="433" text-anchor="middle" font-size="14" fill="#111">Parent 3, child 5:  L[5] = 3  &#8805;  d[3] = 3  &#8594; <tspan font-weight="bold">true</tspan></text>
  <text x="280" y="455" text-anchor="middle" font-size="15" fill="#a33" font-weight="bold">&#8658; Vertex 3 is an articulation point</text>
</svg>

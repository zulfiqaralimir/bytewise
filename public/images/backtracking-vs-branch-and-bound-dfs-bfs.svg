<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="900" height="400" fill="#fdfdfb"/>

  <!-- Titles -->
  <text x="200" y="28" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">Backtracking &#8594; DFS</text>
  <text x="670" y="28" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">Branch &amp; Bound &#8594; BFS</text>

  <!-- ===================== LEFT TREE (DFS) ===================== -->
  <g>
    <!-- edges root->L1 -->
    <line x1="200" y1="55" x2="70"  y2="115" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="55" x2="200" y2="115" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="55" x2="330" y2="115" stroke="#999" stroke-width="1.3"/>
    <!-- edges L1->L2 -->
    <line x1="70"  y1="140" x2="35"  y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="70"  y1="140" x2="105" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="140" x2="165" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="140" x2="235" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="330" y1="140" x2="295" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="330" y1="140" x2="365" y2="200" stroke="#999" stroke-width="1.3"/>

    <!-- nodes -->
    <circle cx="200" cy="40"  r="17" fill="#2c3e50"/><text x="200" y="45"  text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
    <circle cx="70"  cy="128" r="15" fill="#b8860b"/><text x="70"  y="133" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
    <circle cx="200" cy="128" r="15" fill="#b8860b"/><text x="200" y="133" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">5</text>
    <circle cx="330" cy="128" r="15" fill="#b8860b"/><text x="330" y="133" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">8</text>

    <circle cx="35"  cy="215" r="14" fill="#2c7fb8"/><text x="35"  y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text>
    <circle cx="105" cy="215" r="14" fill="#2c7fb8"/><text x="105" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text>
    <circle cx="165" cy="215" r="14" fill="#2c7fb8"/><text x="165" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">6</text>
    <circle cx="235" cy="215" r="14" fill="#2c7fb8"/><text x="235" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">7</text>
    <circle cx="295" cy="215" r="14" fill="#2c7fb8"/><text x="295" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">9</text>
    <circle cx="365" cy="215" r="14" fill="#2c7fb8"/><text x="365" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">10</text>
  </g>

  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Dives to the bottom of one branch completely before trying the next.</text>

  <!-- ===================== RIGHT TREE (BFS) ===================== -->
  <g transform="translate(470,0)">
    <!-- edges root->L1 -->
    <line x1="200" y1="55" x2="70"  y2="115" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="55" x2="200" y2="115" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="55" x2="330" y2="115" stroke="#999" stroke-width="1.3"/>
    <!-- edges L1->L2 -->
    <line x1="70"  y1="140" x2="35"  y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="70"  y1="140" x2="105" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="140" x2="165" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="200" y1="140" x2="235" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="330" y1="140" x2="295" y2="200" stroke="#999" stroke-width="1.3"/>
    <line x1="330" y1="140" x2="365" y2="200" stroke="#999" stroke-width="1.3"/>

    <!-- nodes -->
    <circle cx="200" cy="40"  r="17" fill="#2c3e50"/><text x="200" y="45"  text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
    <circle cx="70"  cy="128" r="15" fill="#b8860b"/><text x="70"  y="133" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
    <circle cx="200" cy="128" r="15" fill="#b8860b"/><text x="200" y="133" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
    <circle cx="330" cy="128" r="15" fill="#b8860b"/><text x="330" y="133" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>

    <circle cx="35"  cy="215" r="14" fill="#2c7fb8"/><text x="35"  y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5</text>
    <circle cx="105" cy="215" r="14" fill="#2c7fb8"/><text x="105" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">6</text>
    <circle cx="165" cy="215" r="14" fill="#2c7fb8"/><text x="165" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">7</text>
    <circle cx="235" cy="215" r="14" fill="#2c7fb8"/><text x="235" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">8</text>
    <circle cx="295" cy="215" r="14" fill="#2c7fb8"/><text x="295" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">9</text>
    <circle cx="365" cy="215" r="14" fill="#2c7fb8"/><text x="365" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">10</text>
  </g>

  <text x="670" y="260" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Visits every node of one level completely before moving to the next level.</text>

  <!-- divider -->
  <line x1="440" y1="10" x2="440" y2="270" stroke="#ddd" stroke-width="1.5"/>

  <rect x="60" y="300" width="780" height="70" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.5"/>
  <text x="450" y="325" text-anchor="middle" font-size="14" fill="#111">Both strategies use the same brute-force idea and build the same state-space tree.</text>
  <text x="450" y="348" text-anchor="middle" font-size="14" fill="#111">The numbers above show only the visiting order — depth-first vs. breadth-first.</text>
</svg>

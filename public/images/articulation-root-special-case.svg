<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="700" height="260" fill="#fdfdfb"/>

  <text x="175" y="25" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">Root with 1 child &#8594; NOT an articulation point</text>
  <text x="525" y="25" text-anchor="middle" font-size="15" fill="#a33" font-weight="bold">Root with 2+ children &#8594; IS an articulation point</text>

  <!-- LEFT: root with one child -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="175" y1="60" x2="175" y2="110"/>
  </g>
  <circle cx="175" cy="45"  r="18" fill="#2e7d32"/><text x="175" y="50" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">root</text>
  <circle cx="175" cy="125" r="16" fill="#2c3e50"/><text x="175" y="130" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">child</text>
  <text x="175" y="170" text-anchor="middle" font-size="12" fill="#555" font-style="italic">(rest of the tree hangs</text>
  <text x="175" y="185" text-anchor="middle" font-size="12" fill="#555" font-style="italic">off this one branch)</text>
  <text x="175" y="215" text-anchor="middle" font-size="12" fill="#111">This matches our example: root 1 has only child 4.</text>

  <!-- divider -->
  <line x1="350" y1="15" x2="350" y2="245" stroke="#ddd" stroke-width="1.3"/>

  <!-- RIGHT: root with two children -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="525" y1="60" x2="470" y2="110"/>
    <line x1="525" y1="60" x2="580" y2="110"/>
  </g>
  <circle cx="525" cy="45"  r="18" fill="#a33"/><text x="525" y="50" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">root</text>
  <circle cx="470" cy="125" r="16" fill="#2c3e50"/><text x="470" y="130" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">child</text>
  <circle cx="580" cy="125" r="16" fill="#2c3e50"/><text x="580" y="130" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">child</text>
  <text x="525" y="170" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Two separate subtrees hang</text>
  <text x="525" y="185" text-anchor="middle" font-size="12" fill="#555" font-style="italic">off the root independently</text>
  <text x="525" y="215" text-anchor="middle" font-size="12" fill="#111">Removing the root disconnects them from each other.</text>
</svg>

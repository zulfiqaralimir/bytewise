<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="760" height="380" fill="#fdfdfb"/>

  <text x="30" y="30" font-size="15" fill="#333" font-weight="bold">Key space</text>
  <ellipse cx="90" cy="190" rx="75" ry="160" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.5"/>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="90" y="70">8</text>
    <text x="90" y="100">3</text>
    <text x="90" y="130">13</text>
    <text x="90" y="160">6</text>
    <text x="90" y="190">4</text>
    <text x="90" y="220">10</text>
    <text x="90" y="260">50</text>
  </g>

  <rect x="290" y="45" width="120" height="45" rx="6" fill="#eef4fa" stroke="#2c7fb8" stroke-width="1.3"/>
  <text x="350" y="72" text-anchor="middle" font-size="16" fill="#2c7fb8" font-weight="bold">h(x) = x</text>

  <text x="560" y="30" font-size="15" fill="#333" font-weight="bold">Hash Table</text>
  <g stroke="#2c3e50" stroke-width="1.2" fill="#fff">
    <rect x="540" y="45"  width="140" height="26"/>
    <rect x="540" y="71"  width="140" height="26"/>
    <rect x="540" y="97"  width="140" height="26"/>
    <rect x="540" y="123" width="140" height="26"/>
    <rect x="540" y="149" width="140" height="26"/>
    <rect x="540" y="175" width="140" height="26"/>
    <rect x="540" y="201" width="140" height="26"/>
    <rect x="540" y="227" width="140" height="26"/>
    <rect x="540" y="253" width="140" height="26"/>
    <rect x="540" y="279" width="140" height="26"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="525" y="62"  text-anchor="end">0</text>
    <text x="525" y="88"  text-anchor="end">1</text>
    <text x="525" y="114" text-anchor="end">2</text>
    <text x="525" y="140" text-anchor="end">3</text>
    <text x="525" y="166" text-anchor="end">4</text>
    <text x="525" y="192" text-anchor="end">5</text>
    <text x="525" y="218" text-anchor="end">6</text>
    <text x="525" y="244" text-anchor="end">7</text>
    <text x="525" y="270" text-anchor="end">8</text>
    <text x="525" y="296" text-anchor="end">9</text>
  </g>
  <g font-size="14" fill="#111" font-weight="bold">
    <text x="605" y="140">3</text>
    <text x="605" y="166">4</text>
    <text x="605" y="218">6</text>
    <text x="605" y="270">8</text>
    <text x="605" y="296">10</text>
  </g>
  <text x="610" y="330" text-anchor="middle" font-size="11" fill="#a33" font-style="italic">key = 50 needs index 50 &#8212;</text>
  <text x="610" y="345" text-anchor="middle" font-size="11" fill="#a33" font-style="italic">table needs 51+ mostly-empty slots.</text>

  <!-- arrows from keys to indices -->
  <g stroke="#2c7fb8" stroke-width="1.1" opacity="0.8">
    <path d="M120,100 C 250,100 400,140 538,140" fill="none"/>
    <path d="M120,190 C 250,190 400,166 538,166" fill="none"/>
    <path d="M120,160 C 250,160 400,218 538,218" fill="none"/>
    <path d="M120,70  C 250,70  400,270 538,270" fill="none"/>
  </g>

  <text x="380" y="355" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Search time is O(1) — but space is wasted whenever key values are sparse or large.</text>
</svg>

<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif">
  <rect x="0" y="0" width="780" height="320" fill="#fdfdfb"/>

  <g font-family="Courier New, monospace" font-size="15" fill="#111">
    <text x="30" y="35">Algorithm Add(A, B, n)</text>
    <text x="30" y="60">{</text>
    <text x="55" y="90">for (i = 0; i &lt; n; i++)</text>
    <text x="55" y="112">{</text>
    <text x="80" y="140">for (j = 0; j &lt; n; j++)</text>
    <text x="80" y="162">{</text>
    <text x="105" y="190">C[i,j] = A[i,j] + B[i,j];</text>
    <text x="80" y="212">}</text>
    <text x="55" y="234">}</text>
    <text x="30" y="256">}</text>
  </g>

  <!-- outer for count -->
  <line x1="290" y1="82" x2="460" y2="82" stroke="#999" stroke-width="1.2"/>
  <text x="470" y="87" font-size="15" fill="#b8860b" font-weight="bold">n + 1</text>

  <!-- inner for count -->
  <line x1="315" y1="132" x2="460" y2="132" stroke="#999" stroke-width="1.2"/>
  <text x="470" y="137" font-size="15" fill="#2c7fb8" font-weight="bold">n &#215; (n + 1)</text>

  <!-- assignment count -->
  <line x1="380" y1="182" x2="460" y2="182" stroke="#999" stroke-width="1.2"/>
  <text x="470" y="187" font-size="15" fill="#a33" font-weight="bold">n &#215; n</text>

  <!-- Result box -->
  <rect x="560" y="60" width="200" height="100" rx="8" fill="#2c3e50"/>
  <text x="660" y="95" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">f(n) = 2n&#178; + 2n + 1</text>
  <text x="660" y="128" text-anchor="middle" font-size="17" fill="#fff" font-weight="bold">O(n&#178;)</text>

  <!-- Space box -->
  <rect x="560" y="180" width="200" height="120" rx="8" fill="#f4f1e9" stroke="#b8860b" stroke-width="1.3"/>
  <text x="660" y="202" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">Space</text>
  <text x="580" y="225" font-size="13" fill="#111">A, B, C &#8594; n&#178; each</text>
  <text x="580" y="245" font-size="13" fill="#111">n, i, j &#8594; 1 each</text>
  <text x="660" y="270" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">S(n) = 3n&#178; + 3</text>
  <text x="660" y="292" text-anchor="middle" font-size="15" fill="#b8860b" font-weight="bold">O(n&#178;)</text>

  <text x="290" y="285" text-anchor="middle" font-size="12" fill="#555" font-style="italic">Degree 2 throughout &#8594; both time and space are O(n&#178;).</text>
</svg>
